<!DOCTYPE html>
<html lang="en" data-theme="orange">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GymERP — Admin Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg-base:#09090b;--bg-surface:#111115;--bg-elevated:#18181d;--bg-muted:#202027;
  --border:rgba(255,255,255,0.07);--border-strong:rgba(255,255,255,0.14);
  --text-primary:#f4f4f6;--text-secondary:#9ca3af;--text-muted:#52525b;
  --accent:#ff5722;--accent-hover:#ff6e3a;--accent-glow:rgba(255,87,34,0.18);--accent-subtle:rgba(255,87,34,0.1);--accent-fg:#ffffff;
}
[data-theme=blue]{--accent:#0ea5e9;--accent-hover:#38bdf8;--accent-glow:rgba(14,165,233,0.18);--accent-subtle:rgba(14,165,233,0.1);--accent-fg:#ffffff;}
[data-theme=green]{--accent:#22c55e;--accent-hover:#4ade80;--accent-glow:rgba(34,197,94,0.16);--accent-subtle:rgba(34,197,94,0.09);--accent-fg:#051509;}
[data-theme=purple]{--accent:#8b5cf6;--accent-hover:#a78bfa;--accent-glow:rgba(139,92,246,0.18);--accent-subtle:rgba(139,92,246,0.1);--accent-fg:#ffffff;}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg-base);
  color:var(--text-primary);
  height:100vh;
  display:flex;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
/* SIDEBAR */
.sidebar{
  width:235px;
  flex-shrink:0;
  background:var(--bg-surface);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  box-shadow:inset -1px 0 0 0 rgba(255,255,255,0.03);
}
.sb-logo{display:flex;align-items:center;gap:.65rem;padding:1.15rem .95rem;border-bottom:1px solid var(--border);}
.sb-logo-icon{
  width:30px;
  height:30px;
  background:linear-gradient(135deg,var(--accent) 0%,color-mix(in srgb,var(--accent) 70%,#000) 100%);
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  box-shadow:0 0 0 1px rgba(255,255,255,0.1),0 0 14px var(--accent-glow);
}
.sb-logo-icon svg{color:#fff;width:16px;height:16px;}
.sb-gym{font-size:.9rem;font-weight:700;letter-spacing:-0.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb-nav{flex:1;padding:.65rem .45rem;display:flex;flex-direction:column;gap:.15rem;}
.nav-item{
  display:flex;
  align-items:center;
  gap:.65rem;
  padding:.45rem .65rem;
  border-radius:7px;
  font-size:.83rem;
  font-weight:500;
  color:var(--text-secondary);
  cursor:pointer;
  transition:all 120ms;
}
.nav-item svg{width:16px;height:16px;color:var(--text-muted);transition:color 120ms;}
.nav-item:hover{background:var(--bg-muted);color:var(--text-primary);}
.nav-item:hover svg{color:var(--text-primary);}
.nav-item.active{
  background:var(--accent-subtle);
  color:var(--text-primary);
  border-left:2px solid var(--accent);
  font-weight:600;
}
.nav-item.active svg{color:var(--accent);}
.sb-bottom{padding:.75rem .85rem .95rem;border-top:1px solid var(--border);}
.sb-user{display:flex;align-items:center;gap:.6rem;margin-bottom:.75rem;}
.sb-avatar{
  width:28px;
  height:28px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--accent-subtle),var(--bg-elevated));
  border:1.5px solid var(--accent);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:.75rem;
  font-weight:700;
  color:var(--accent);
}
.theme-dots{display:flex;align-items:center;gap:.35rem;}
.theme-dots span{font-size:.66rem;color:var(--text-muted);font-weight:500;}
.dot{width:12px;height:12px;border-radius:50%;cursor:pointer;border:1.5px solid transparent;transition:all 120ms;}
.dot.active{border-color:rgba(255,255,255,.5);transform:scale(1.15);}
.dot-orange{background:#ff5722;}.dot-blue{background:#0ea5e9;}.dot-green{background:#22c55e;}.dot-purple{background:#8b5cf6;}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.page-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:.85rem 1.5rem;
  border-bottom:1px solid var(--border);
  background:rgba(17,17,21,0.5);
  backdrop-filter:blur(8px);
  flex-shrink:0;
}
.page-title{font-size:1.15rem;font-weight:700;letter-spacing:-0.02em;}
.breadcrumb{font-size:.7rem;color:var(--text-muted);margin-bottom:.15rem;display:flex;align-items:center;gap:.3rem;}
.breadcrumb svg{width:10px;height:10px;}
.content{flex:1;overflow-y:auto;padding:1.35rem 1.5rem;}

/* DASHBOARD */
.greet-wrap{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;}
.greet{font-size:1.1rem;font-weight:700;letter-spacing:-0.02em;}
.greet span{color:var(--accent);}
.date-pill{
  font-size:.7rem;
  font-weight:500;
  color:var(--text-secondary);
  background:var(--bg-muted);
  border:1px solid var(--border-strong);
  padding:.25rem .65rem;
  border-radius:20px;
  display:inline-flex;
  align-items:center;
  gap:.35rem;
}
.date-pill svg{width:12px;height:12px;color:var(--accent);}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-bottom:1.25rem;}
.stat-card{
  background:var(--bg-surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:1rem;
  box-shadow:inset 0 1px 0 0 rgba(255,255,255,0.04);
  position:relative;
  overflow:hidden;
}
.stat-label{font-size:.68rem;font-weight:600;color:var(--text-muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:.5rem;}
.stat-num{font-size:2rem;font-weight:800;letter-spacing:-0.03em;line-height:1;font-variant-numeric:tabular-nums;}
.stat-trend{font-size:.72rem;margin-top:.45rem;display:flex;align-items:center;gap:.3rem;}
.stat-trend svg{width:13px;height:13px;}
.trend-up{color:#4ade80;}.trend-warn{color:#facc15;}.trend-rev{color:var(--accent);}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;margin-bottom:.75rem;}
.mini-card{
  background:var(--bg-surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:1.1rem;
  box-shadow:inset 0 1px 0 0 rgba(255,255,255,0.04);
}
.mini-card-title{font-size:.84rem;font-weight:700;margin-bottom:.85rem;display:flex;align-items:center;gap:.45rem;}
.mini-card-title svg{width:15px;height:15px;color:var(--accent);}
.mini-row{display:flex;justify-content:space-between;align-items:center;padding:.45rem 0;border-bottom:1px solid var(--border);font-size:.82rem;}
.mini-row:last-child{border-bottom:none;}
.mini-row-name{font-weight:500;}
.mini-row-meta{color:var(--text-secondary);font-size:.75rem;}
.view-all{
  display:inline-flex;
  align-items:center;
  gap:.3rem;
  font-size:.75rem;
  color:var(--accent);
  margin-top:.85rem;
  cursor:pointer;
  text-decoration:none;
  font-weight:600;
  transition:gap 120ms;
}
.view-all:hover{gap:.45rem;}
.view-all svg{width:13px;height:13px;}

/* CHART */
.chart-card{
  background:var(--bg-surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:1.1rem;
  box-shadow:inset 0 1px 0 0 rgba(255,255,255,0.04);
}
.chart-title{font-size:.84rem;font-weight:700;margin-bottom:.85rem;display:flex;align-items:center;gap:.45rem;}
.chart-title svg{width:15px;height:15px;color:var(--accent);}
.bar-chart{display:flex;align-items:flex-end;gap:.6rem;height:85px;}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:.35rem;flex:1;}
.bar{
  background:var(--accent);
  border-radius:4px 4px 0 0;
  width:100%;
  opacity:.85;
  min-height:6px;
  transition:all 150ms;
}
.bar:hover{opacity:1;transform:scaleY(1.04);box-shadow:0 0 10px var(--accent-glow);}
.bar-label{font-size:.65rem;color:var(--text-muted);font-weight:500;}
.bar-val{font-size:.65rem;color:var(--text-secondary);font-weight:600;}

/* TABLE & TOOLBAR */
.toolbar{display:flex;align-items:center;gap:.6rem;margin-bottom:.75rem;flex-wrap:wrap;}
.search-box{position:relative;flex:1;max-width:280px;}
.search-box input{
  width:100%;
  height:34px;
  background:var(--bg-muted);
  border:1px solid var(--border-strong);
  border-radius:7px;
  color:var(--text-primary);
  font-family:'Inter',sans-serif;
  font-size:.8rem;
  padding:0 .75rem 0 2.1rem;
  outline:none;
  transition:all 150ms;
}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow);}
.search-box input::placeholder{color:var(--text-muted);}
.search-icon{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);color:var(--text-muted);display:flex;align-items:center;pointer-events:none;}
.search-icon svg{width:14px;height:14px;}
.select-f{
  height:34px;
  background:var(--bg-muted);
  border:1px solid var(--border-strong);
  border-radius:7px;
  color:var(--text-secondary);
  font-family:'Inter',sans-serif;
  font-size:.8rem;
  padding:0 .75rem;
  outline:none;
  cursor:pointer;
}
.btn-sm{
  height:34px;
  padding:0 .9rem;
  background:var(--accent);
  color:var(--accent-fg);
  font-family:'Inter',sans-serif;
  font-size:.78rem;
  font-weight:600;
  border:none;
  border-radius:7px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:.35rem;
  transition:all 150ms;
}
.btn-sm svg{width:14px;height:14px;}
.btn-sm:hover{box-shadow:0 0 14px var(--accent-glow);background:var(--accent-hover);}
.table-wrap{
  background:var(--bg-surface);
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
  box-shadow:inset 0 1px 0 0 rgba(255,255,255,0.04);
}
table{width:100%;border-collapse:collapse;}
thead th{
  padding:.65rem 1rem;
  text-align:left;
  font-size:.66rem;
  font-weight:600;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--text-muted);
  border-bottom:1px solid var(--border);
  background:rgba(255,255,255,0.015);
}
tbody tr{border-bottom:1px solid var(--border);cursor:pointer;transition:background 100ms;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:rgba(255,255,255,.025);}
tbody td{padding:.7rem 1rem;font-size:.84rem;}
.badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.7rem;font-weight:600;padding:.2rem .55rem;border-radius:5px;}
.b-active{background:rgba(16,185,129,0.1);color:#34d399;border:1px solid rgba(16,185,129,0.25);}
.b-expired{background:rgba(239,68,68,.1);color:#f87171;border:1px solid rgba(239,68,68,.25);}
.b-frozen{background:rgba(59,130,246,.1);color:#60a5fa;border:1px solid rgba(59,130,246,.25);}
.b-expiring{background:rgba(234,179,8,.1);color:#facc15;border:1px solid rgba(234,179,8,.25);}
.d-s{width:6px;height:6px;border-radius:50%;display:inline-block;}
.d-a{background:#10b981;box-shadow:0 0 5px #10b981;}.d-ex{background:#ef4444;box-shadow:0 0 5px #ef4444;}.d-fr{background:#3b82f6;box-shadow:0 0 5px #3b82f6;}.d-ep{background:#eab308;box-shadow:0 0 5px #eab308;}
.pagination{display:flex;align-items:center;justify-content:space-between;padding:.65rem 1rem;border-top:1px solid var(--border);}
.pag-info{font-size:.75rem;color:var(--text-muted);}
.pag-btns{display:flex;gap:.3rem;}
.pag-btn{
  width:26px;
  height:26px;
  border-radius:5px;
  background:var(--bg-muted);
  border:1px solid var(--border);
  color:var(--text-secondary);
  font-size:.75rem;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all 100ms;
}
.pag-btn svg{width:13px;height:13px;}
.pag-btn:hover,.pag-btn.active{background:var(--accent-subtle);color:var(--accent);border-color:var(--accent);}

/* PLANS */
.plans-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.85rem;}
.plan-card{
  background:var(--bg-surface);
  border:1px solid var(--border);
  border-radius:12px;
  padding:1.25rem;
  transition:all 150ms;
  position:relative;
  box-shadow:inset 0 1px 0 0 rgba(255,255,255,0.04);
}
.plan-card:hover{box-shadow:inset 0 0 16px var(--accent-glow),0 6px 24px rgba(0,0,0,0.3);border-color:var(--border-strong);}
.plan-name{font-size:.92rem;font-weight:700;margin-bottom:.25rem;}
.plan-price{font-size:1.85rem;font-weight:800;color:var(--accent);letter-spacing:-0.03em;line-height:1.1;font-variant-numeric:tabular-nums;}
.plan-days{font-size:.72rem;color:var(--text-secondary);margin-top:.15rem;}
.plan-active{font-size:.74rem;color:var(--text-muted);margin:.65rem 0 .9rem;display:flex;align-items:center;gap:.35rem;}
.plan-active svg{width:13px;height:13px;}
.plan-btns{display:flex;gap:.4rem;}
.btn-ghost{
  height:30px;
  padding:0 .75rem;
  background:transparent;
  border:1px solid var(--border-strong);
  color:var(--text-secondary);
  font-family:'Inter',sans-serif;
  font-size:.74rem;
  font-weight:500;
  border-radius:6px;
  cursor:pointer;
  transition:all 120ms;
}
.btn-ghost:hover{color:var(--text-primary);border-color:var(--text-secondary);background:var(--bg-muted);}
.btn-danger-sm{
  height:30px;
  padding:0 .75rem;
  background:rgba(239,68,68,.08);
  border:1px solid rgba(239,68,68,.3);
  color:#f87171;
  font-family:'Inter',sans-serif;
  font-size:.74rem;
  font-weight:500;
  border-radius:6px;
  cursor:pointer;
  transition:all 120ms;
}
.btn-danger-sm:hover{background:rgba(239,68,68,.18);}
.archived-label{font-size:.8rem;font-weight:600;color:var(--text-muted);margin-top:1.5rem;margin-bottom:.5rem;}
.archived-item{
  font-size:.78rem;
  color:var(--text-muted);
  padding:.4rem 0;
  display:flex;
  align-items:center;
  gap:.4rem;
}
.archived-item svg{width:14px;height:14px;}

/* DRAWER */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:100;display:none;}
.drawer{
  position:fixed;
  right:0;
  top:0;
  bottom:0;
  width:380px;
  background:var(--bg-elevated);
  border-left:1px solid var(--border-strong);
  box-shadow:-8px 0 32px rgba(0,0,0,0.5);
  z-index:101;
  display:none;
  flex-direction:column;
  transform:translateX(100%);
  transition:transform 250ms cubic-bezier(0.32,0.72,0,1);
}
.drawer.open{transform:translateX(0);}
.dh{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.25rem;border-bottom:1px solid var(--border);}
.dh-title{font-size:.95rem;font-weight:700;}
.close-btn{
  background:transparent;
  border:1px solid var(--border);
  color:var(--text-secondary);
  cursor:pointer;
  width:28px;
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:6px;
  transition:all 150ms;
}
.close-btn svg{width:15px;height:15px;}
.close-btn:hover{color:var(--text-primary);border-color:var(--border-strong);background:var(--bg-muted);}
.drawer-body{flex:1;overflow-y:auto;padding:1.25rem;}
.db-avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  background:var(--accent-subtle);
  border:2px solid var(--accent);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.2rem;
  font-weight:700;
  color:var(--accent);
  margin-bottom:.75rem;
}
.db-name{font-size:1.15rem;font-weight:800;letter-spacing:-0.02em;}
.db-sec-title{font-size:.7rem;font-weight:700;color:var(--text-secondary);letter-spacing:.05em;text-transform:uppercase;margin:1.1rem 0 .4rem;}
.db-row{display:flex;justify-content:space-between;align-items:center;padding:.45rem 0;border-bottom:1px solid var(--border);font-size:.82rem;}
.db-row:last-child{border-bottom:none;}
.db-label{color:var(--text-muted);display:flex;align-items:center;gap:.4rem;}
.db-label svg{width:14px;height:14px;}
.progress-bar{height:6px;background:var(--bg-muted);border-radius:3px;margin-top:.55rem;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);border-radius:3px;}
.drawer-footer{display:flex;gap:.4rem;flex-wrap:wrap;padding:1rem 1.25rem;border-top:1px solid var(--border);}
.btn-df{
  height:32px;
  padding:0 .85rem;
  font-family:'Inter',sans-serif;
  font-size:.76rem;
  font-weight:600;
  border-radius:6px;
  cursor:pointer;
  border:1px solid var(--border-strong);
  background:var(--bg-muted);
  color:var(--text-secondary);
  transition:all 120ms;
}
.btn-df:hover{color:var(--text-primary);border-color:var(--text-primary);}
.btn-df-danger{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3);color:#f87171;}
.btn-df-danger:hover{background:rgba(239,68,68,.2);}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;}
.modal{
  background:var(--bg-elevated);
  border:1px solid var(--border-strong);
  border-radius:12px;
  padding:1.6rem;
  width:100%;
  max-width:420px;
  box-shadow:inset 0 1px 0 0 rgba(255,255,255,0.06),0 8px 40px rgba(0,0,0,.6);
}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.15rem;}
.modal-title{font-size:1rem;font-weight:700;}
.mfield{margin-bottom:.85rem;}
.mfield label{display:block;font-size:.68rem;font-weight:600;color:var(--text-secondary);letter-spacing:.04em;text-transform:uppercase;margin-bottom:.35rem;}
.mfield input,.mfield select,.mfield textarea{
  width:100%;
  height:36px;
  background:var(--bg-muted);
  border:1px solid var(--border-strong);
  border-radius:7px;
  color:var(--text-primary);
  font-family:'Inter',sans-serif;
  font-size:.82rem;
  padding:0 .75rem;
  outline:none;
  transition:border-color 150ms;
}
.mfield input:focus,.mfield select:focus,.mfield textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow);}
.mfield textarea{height:65px;padding:.5rem .75rem;resize:none;}
.modal-btns{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1.25rem;}
.btn-mg{height:34px;padding:0 .9rem;background:transparent;border:1px solid var(--border-strong);color:var(--text-secondary);font-family:'Inter',sans-serif;font-size:.8rem;border-radius:6px;cursor:pointer;}
.btn-mg:hover{color:var(--text-primary);background:var(--bg-muted);}
.btn-ma{
  height:34px;
  padding:0 .95rem;
  background:var(--accent);
  color:var(--accent-fg);
  font-family:'Inter',sans-serif;
  font-size:.8rem;
  font-weight:600;
  border:none;
  border-radius:6px;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:.35rem;
}
.btn-ma svg{width:14px;height:14px;}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sb-logo">
    <div class="sb-logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v16M18 4v16M3 8h4M17 8h4M3 16h4M17 16h4M7 12h10"/></svg>
    </div>
    <div class="sb-gym">FitZone Gym</div>
  </div>
  <div class="sb-nav">
    <div class="nav-item active" onclick="switchPage('dashboard',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
      Dashboard

function filterMembers(){
  const q=document.getElementById('mSearch')?.value?.toLowerCase()||'';
  const st=document.getElementById('mStatus')?.value||'';
  filteredMembers=members.filter(m=>{
    return (!q||m.name.toLowerCase().includes(q)||m.phone.includes(q))&&(!st||m.status===st);
  });
  renderMembersTable();
}

function renderMembersTable(){
  const tb=document.getElementById('membersTable');
  if(!tb) return;
  tb.innerHTML=filteredMembers.map(m=>`
    <tr onclick="openMemberDrawer(${m.id})">
      <td style="font-weight:600">${m.name}</td>
      <td style="color:var(--text-secondary);font-size:.78rem;font-family:'JetBrains Mono',monospace">${m.phone}</td>
      <td><span class="badge" style="background:var(--bg-muted);color:var(--text-secondary);border:1px solid var(--border-strong)">${m.plan}</span></td>
      <td>${statusBadge(m.status)}</td>
      <td style="color:var(--text-secondary)">${m.joined}</td>
    </tr>
  `).join('');
  const pi=document.getElementById('mPagInfo');
  if(pi) pi.textContent=`Showing 1–${filteredMembers.length} of ${members.length} members`;
}

  document.getElementById('headerAction').innerHTML=`

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
      New Plan
    </button>
  `;
  document.getElementById('content').innerHTML=`
    <div class="plans-grid">
      ${plans.map(p=>`
        <div class="plan-card">
          <div class="plan-name">${p.name}</div>
          <div class="plan-price">${p.price}</div>
          <div class="plan-days">${p.days}</div>
          <div class="plan-active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            ${p.active} active subscriptions
          </div>
          <div class="plan-btns">
            <button class="btn-ghost">Edit Plan</button>
            <button class="btn-danger-sm">Archive</button>
          </div>
        </div>
      `).join('')}
    </div>
    <div class="archived-label">Archived Packages (1)</div>
    <div class="archived-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 8 21 21 3 21 3 8"/><rect width="22" height="5" x="1" y="3" rx="1"/><line x1="10" x2="14" y1="12" y2="12"/></svg>
      6-Month Seasonal Tier — Archived Jun 2025
    </div>
  `;
}

function renderPayments(){
  document.getElementById('breadcrumb').innerHTML='Admin &rsaquo; Ledger';
  document.getElementById('pageTitle').textContent='Payments & Invoices';
  document.getElementById('headerAction').innerHTML=`
    <button class="btn-sm" onclick="openCashModal()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
      Record Cash Payment
    </button>
  `;
  document.getElementById('content').innerHTML=`
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        </span>
        <input type="text" placeholder="Search transactions...">
      </div>
      <select class="select-f"><option>Method: All</option><option>Online</option><option>Cash</option></select>
      <select class="select-f"><option>Status: All</option><option>Paid</option><option>Failed</option></select>
      <button class="btn-sm" onclick="openCashModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" x2="12" y1="5" y2="19"/><line x1="5" x2="19" y1="12" y2="12"/></svg>
        Record Cash Payment
      </button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Member</th><th>Amount</th><th>Method</th><th>Status</th><th>Date</th></tr></thead>
        <tbody>
          ${payments.map(p=>`
            <tr>
              <td style="font-weight:600">${p.member}</td>
              <td style="font-weight:700;font-variant-numeric:tabular-nums">${p.amount}</td>
              <td><span class="badge" style="background:var(--bg-muted);color:var(--text-secondary);border:1px solid var(--border-strong)">${p.method}</span></td>
              <td>
                ${p.status==='paid'
                  ? `<span class="badge b-active"><svg style="width:12px;height:12px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Paid</span>`
                  : `<span class="badge b-expired"><svg style="width:12px;height:12px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg> Failed</span>`
                }
              </td>
              <td style="color:var(--text-secondary)">${p.date}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      <div class="pagination"><div class="pag-info">Showing 1–${payments.length} of ${payments.length} payments</div></div>
    </div>
  `;
}

function switchPage(page,el){
  currentPage=page;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if(el) el.classList.add('active');
  if(page==='dashboard') renderDashboard();
  else if(page==='members') renderMembers();
  else if(page==='plans') renderPlans();
  else if(page==='payments') renderPayments();
}

function showDrawer(){
  document.getElementById('overlay').style.display='block';
  const dr=document.getElementById('drawer');
  dr.style.display='flex';
  requestAnimationFrame(()=>dr.classList.add('open'));
}
function closeDrawer(){
  const dr=document.getElementById('drawer');
  dr.classList.remove('open');
  setTimeout(()=>{dr.style.display='none';document.getElementById('overlay').style.display='none';},260);
}

function openAddMember(){
  document.getElementById('modalBox').innerHTML=`
    <div class="modal-header">
      <div class="modal-title">Enroll New Member</div>
      <button class="close-btn" onclick="closeModal()" aria-label="Close modal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>
      </button>
    </div>
    <div class="mfield"><label>Full Legal Name</label><input type="text" placeholder="e.g. Ravi Kumar"></div>
    <div class="mfield"><label>Phone Number</label><input type="tel" placeholder="9876543210"></div>
    <div class="mfield"><label>Email Address</label><input type="email" placeholder="member@email.com"></div>
    <div class="mfield"><label>Subscription Plan</label><select>${plans.map(p=>`<option>${p.name} — ${p.price}</option>`).join('')}</select></div>
    <div class="modal-btns">
      <button class="btn-mg" onclick="closeModal()">Cancel</button>
      <button class="btn-ma" onclick="closeModal()">
        Register Member
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" x2="19" y1="12" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>
  `;
  document.getElementById('modalOverlay').style.display='flex';
}
function openAddPlan(){
  document.getElementById('modalBox').innerHTML=`
    <div class="modal-header">
      <div class="modal-title">Create Membership Plan</div>
      <button class="close-btn" onclick="closeModal()" aria-label="Close modal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>
      </button>
    </div>
    <div class="mfield"><label>Plan Title</label><input type="text" placeholder="e.g. 6-Month Crossfit Access"></div>
    <div class="mfield"><label>Pricing (₹)</label><input type="number" placeholder="4999"></div>
    <div class="mfield"><label>Duration Term (days)</label><input type="number" placeholder="180"></div>
    <div class="modal-btns">
      <button class="btn-mg" onclick="closeModal()">Cancel</button>
      <button class="btn-ma" onclick="closeModal()">
        Save Plan
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" x2="19" y1="12" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>
  `;
  document.getElementById('modalOverlay').style.display='flex';
}
function openCashModal(){
  document.getElementById('modalBox').innerHTML=`
    <div class="modal-header">
      <div class="modal-title">Record Desk Cash Collection</div>
      <button class="close-btn" onclick="closeModal()" aria-label="Close modal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/></svg>
      </button>
    </div>
    <div class="mfield"><label>Select Member</label><input type="text" placeholder="Search member by name..."></div>
    <div class="mfield"><label>Associated Plan</label><select>${plans.map(p=>`<option>${p.name} — ${p.price}</option>`).join('')}</select></div>
    <div class="mfield"><label>Received Amount (₹)</label><input type="number" placeholder="999"></div>
    <div class="mfield"><label>Transaction Note (optional)</label><textarea placeholder="e.g. Received cash at front desk"></textarea></div>
    <div class="modal-btns">
      <button class="btn-mg" onclick="closeModal()">Cancel</button>
      <button class="btn-ma" onclick="closeModal()">
        Confirm Receipt
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" x2="19" y1="12" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>
  `;
  document.getElementById('modalOverlay').style.display='flex';
}
function closeModal(e){if(!e||e.target===document.getElementById('modalOverlay')||e.target.closest('.close-btn')||e.target.closest('.btn-mg'))document.getElementById('modalOverlay').style.display='none';}
function setTheme(t,el){
  document.documentElement.setAttribute('data-theme',t);
  document.querySelectorAll('.dot').forEach(d=>d.classList.remove('active'));
  el.classList.add('active');
  localStorage.setItem('gymerp-theme',t);
}
const s=localStorage.getItem('gymerp-theme');
if(s){
  const el=document.querySelector('.dot-'+s);
  if(el)setTheme(s,el);
}
renderDashboard();
</script>
</body>
</html>
