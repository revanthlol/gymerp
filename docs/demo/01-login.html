<!DOCTYPE html>
<html lang="en" data-theme="orange">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GymERP — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg-base:#0A0A0A;--bg-surface:#111113;--bg-elevated:#1A1A1F;--bg-muted:#222228;--border:rgba(255,255,255,0.08);--border-strong:rgba(255,255,255,0.15);--text-primary:#F4F4F5;--text-secondary:#A1A1AA;--text-muted:#52525B;--accent:#FF5722;--accent-hover:#FF6D3A;--accent-glow:rgba(255,87,34,0.18);--accent-subtle:rgba(255,87,34,0.1);--accent-fg:#fff;}
[data-theme=blue]{--accent:#00B4FF;--accent-hover:#22C3FF;--accent-glow:rgba(0,180,255,0.18);--accent-subtle:rgba(0,180,255,0.1);}
[data-theme=green]{--accent:#39FF14;--accent-hover:#50FF30;--accent-glow:rgba(57,255,20,0.15);--accent-subtle:rgba(57,255,20,0.08);--accent-fg:#0a0a0a;}
[data-theme=purple]{--accent:#8B5CF6;--accent-hover:#9D70FF;--accent-glow:rgba(139,92,246,0.18);--accent-subtle:rgba(139,92,246,0.1);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:var(--bg-base);color:var(--text-primary);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;position:relative;overflow:hidden;}
.glow-bg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 40% at 50% 50%, var(--accent-glow) 0%, transparent 70%);z-index:0;}
.back{position:fixed;top:1rem;left:1rem;font-size:.8rem;color:var(--text-muted);text-decoration:none;z-index:10;padding:.4rem .75rem;border:1px solid var(--border);border-radius:6px;background:var(--bg-surface);transition:color 150ms;}
.back:hover{color:var(--text-primary);}
.container{position:relative;z-index:1;width:100%;max-width:380px;}
.logo-area{text-align:center;margin-bottom:2rem;}
.logo-icon{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;background:var(--accent);border-radius:14px;font-size:26px;margin-bottom:.75rem;box-shadow:0 0 32px var(--accent-glow);}
.logo-name{font-size:1.5rem;font-weight:800;letter-spacing:-0.03em;}
.card{background:rgba(17,17,19,0.88);border:1px solid var(--border-strong);box-shadow:inset 0 0 0 1px var(--accent-glow),0 2px 12px rgba(0,0,0,0.5);border-radius:12px;padding:2rem;backdrop-filter:blur(12px);}
.divider{height:1px;background:var(--border);margin:.5rem 0 1.5rem;}
.field{margin-bottom:1.25rem;}
label{display:block;font-size:.72rem;font-weight:600;color:var(--text-secondary);letter-spacing:.04em;text-transform:uppercase;margin-bottom:.4rem;}
.input-wrap{position:relative;}
input{width:100%;height:38px;background:var(--bg-muted);border:1px solid var(--border-strong);border-radius:7px;color:var(--text-primary);font-family:'Inter',sans-serif;font-size:.875rem;padding:0 .75rem;outline:none;transition:border-color 150ms,box-shadow 150ms;}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);}
input::placeholder{color:var(--text-muted);}
.eye-btn{position:absolute;right:.5rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1rem;padding:.25rem;line-height:1;transition:color 150ms;}
.eye-btn:hover{color:var(--text-primary);}
.btn-primary{width:100%;height:40px;background:var(--accent);color:var(--accent-fg);font-family:'Inter',sans-serif;font-size:.875rem;font-weight:600;border:none;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:.5rem;transition:background 150ms,box-shadow 150ms;margin-top:1.5rem;}
.btn-primary:hover{background:var(--accent-hover);box-shadow:0 0 20px var(--accent-glow);}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:rgba(255,255,255,.9);border-radius:50%;animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.error-msg{font-size:.78rem;color:#f87171;margin-top:.75rem;text-align:center;animation:fadeIn 200ms;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}}
.role-select{margin-top:1.5rem;display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;}
.role-btn{padding:.5rem;background:var(--bg-elevated);border:1px solid var(--border);border-radius:7px;color:var(--text-secondary);font-size:.72rem;font-weight:500;cursor:pointer;text-align:center;transition:all 150ms;}
.role-btn:hover,.role-btn.active{background:var(--accent-subtle);border-color:var(--accent);color:var(--text-primary);}
.role-hint{font-size:.7rem;color:var(--text-muted);text-align:center;margin-top:.75rem;}
.theme-bar{display:flex;align-items:center;gap:.6rem;justify-content:center;margin-top:1.5rem;}
.theme-bar span{font-size:.7rem;color:var(--text-muted);}
.swatch{width:14px;height:14px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:box-shadow 100ms;}
.swatch.active{border-color:rgba(255,255,255,.4);}
.sw-orange{background:#FF5722;}.sw-blue{background:#00B4FF;}.sw-green{background:#39FF14;}.sw-purple{background:#8B5CF6;}
</style>
</head>
<body>
<div class="glow-bg"></div>
<a href="index.html" class="back">← All Demos</a>

<div class="container">
  <div class="logo-area">
    <div class="logo-icon">🏋️</div>
    <div class="logo-name">GymERP</div>
  </div>

  <div class="card">
    <div class="divider"></div>

    <div style="margin-bottom:1rem;">
      <div style="font-size:.7rem;font-weight:600;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:.5rem;">Demo: log in as</div>
      <div class="role-select">
        <button class="role-btn active" onclick="setRole('platform',this)">Platform</button>
        <button class="role-btn" onclick="setRole('admin',this)">Admin</button>
        <button class="role-btn" onclick="setRole('staff',this)">Staff</button>
      </div>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="name@example.com" value="rev@gymerp.io" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="••••••••" value="demo1234" required>
          <button type="button" class="eye-btn" onclick="togglePwd()">👁</button>
        </div>
      </div>
      <button type="submit" class="btn-primary" id="signInBtn">
        <span id="btnText">Sign In →</span>
      </button>
    </form>
    <div id="errorMsg" class="error-msg" role="alert" style="display:none"></div>

    <div class="role-hint">Role is auto-detected from JWT — no role selection at login</div>
  </div>

  <div class="theme-bar">
    <span>Accent:</span>
    <div class="swatch sw-orange active" onclick="setTheme('orange',this)"></div>
    <div class="swatch sw-blue" onclick="setTheme('blue',this)"></div>
    <div class="swatch sw-green" onclick="setTheme('green',this)"></div>
    <div class="swatch sw-purple" onclick="setTheme('purple',this)"></div>
  </div>
</div>

<script>
let currentRole='platform';
function setRole(r,el){currentRole=r;document.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');}
function togglePwd(){const p=document.getElementById('password');p.type=p.type==='password'?'text':'password';}
function showError(msg){const el=document.getElementById('errorMsg');el.textContent=msg;el.style.display='block';}
function handleLogin(e){
  e.preventDefault();
  const btn=document.getElementById('signInBtn');
  const btnText=document.getElementById('btnText');
  const errorMsg=document.getElementById('errorMsg');
  errorMsg.style.display='none';
  const email=document.getElementById('email').value;
  const pass=document.getElementById('password').value;
  btn.disabled=true;
  btnText.innerHTML='<div class="spinner"></div>';
  setTimeout(()=>{
    if(pass.length<4){btn.disabled=false;btnText.textContent='Sign In →';showError('Invalid credentials. Please try again.');return;}
    const routes={'platform':'02-platform.html','admin':'03-admin.html','staff':'04-staff.html'};
    window.location.href=routes[currentRole];
  },1400);
}
function setTheme(t,el){document.documentElement.setAttribute('data-theme',t);document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));el.classList.add('active');localStorage.setItem('gymerp-theme',t);}
const s=localStorage.getItem('gymerp-theme');if(s){const el=document.querySelector('.sw-'+s);if(el)setTheme(s,el);}
// Demo: show error if wrong password typed (not demo1234)
document.getElementById('loginForm').addEventListener('submit',()=>{});
</script>
</body>
</html>
