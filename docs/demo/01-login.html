<!DOCTYPE html>
<html lang="en" data-theme="orange">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GymERP — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg-base:#09090b;--bg-surface:#111115;--bg-elevated:#18181d;--bg-muted:#202027;
  --border:rgba(255,255,255,0.07);--border-strong:rgba(255,255,255,0.14);
  --text-primary:#f4f4f6;--text-secondary:#9ca3af;--text-muted:#52525b;
  --accent:#ff5722;--accent-hover:#ff6e3a;--accent-glow:rgba(255,87,34,0.18);--accent-subtle:rgba(255,87,34,0.1);--accent-fg:#ffffff;
}
[data-theme=blue]{--accent:#0ea5e9;--accent-hover:#38bdf8;--accent-glow:rgba(14,165,233,0.18);--accent-subtle:rgba(14,165,233,0.1);--accent-fg:#ffffff;}
[data-theme=green]{--accent:#22c55e;--accent-hover:#4ade80;--accent-glow:rgba(34,197,94,0.16);--accent-subtle:rgba(34,197,94,0.09);--accent-fg:#051509;}
[data-theme=purple]{--accent:#8b5cf6;--accent-hover:#a78bfa;--accent-glow:rgba(139,92,246,0.18);--accent-subtle:rgba(139,92,246,0.1);--accent-fg:#ffffff;}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg-base);
  color:var(--text-primary);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:1.5rem;
  position:relative;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
.glow-bg{
  position:fixed;
  inset:0;
  pointer-events:none;
  background:radial-gradient(ellipse 55% 42% at 50% 45%, var(--accent-glow) 0%, transparent 70%);
  z-index:0;
  transition:background 400ms;
}
.back{
  position:fixed;
  top:1.25rem;
  left:1.25rem;
  font-size:.78rem;
  font-weight:500;
  color:var(--text-secondary);
  text-decoration:none;
  z-index:10;
  padding:.45rem .85rem;
  border:1px solid var(--border);
  border-radius:8px;
  background:rgba(17,17,21,0.85);
  backdrop-filter:blur(10px);
  display:inline-flex;
  align-items:center;
  gap:.45rem;
  transition:all 150ms;
}
.back svg{width:14px;height:14px;stroke-width:2;}
.back:hover{color:var(--text-primary);border-color:var(--border-strong);transform:translateX(-2px);}
.container{position:relative;z-index:1;width:100%;max-width:400px;}
.logo-area{text-align:center;margin-bottom:1.75rem;}
.logo-icon{
  width:48px;
  height:48px;
  background:linear-gradient(135deg,var(--accent) 0%,color-mix(in srgb,var(--accent) 65%,#000) 100%);
  border-radius:12px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-bottom:.85rem;
  box-shadow:0 0 0 1px rgba(255,255,255,0.12),0 0 28px var(--accent-glow),0 8px 24px rgba(0,0,0,0.4);
}
.logo-icon svg{color:#fff;width:24px;height:24px;}
.logo-name{font-size:1.5rem;font-weight:800;letter-spacing:-0.03em;}
.logo-tagline{font-size:.78rem;color:var(--text-secondary);margin-top:.25rem;}
.card{
  background:rgba(17,17,21,0.82);
  border:1px solid var(--border-strong);
  box-shadow:inset 0 1px 0 0 rgba(255,255,255,0.07),0 12px 36px rgba(0,0,0,0.5),0 0 0 1px var(--accent-glow);
  border-radius:14px;
  padding:2rem;
  backdrop-filter:blur(16px);
}
.role-bar-label{font-size:.68rem;font-weight:600;color:var(--text-muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:.55rem;}
.role-select{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem;margin-bottom:1.5rem;}
.role-btn{
  padding:.55rem .45rem;
  background:var(--bg-elevated);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text-secondary);
  font-family:inherit;
  font-size:.73rem;
  font-weight:600;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:.35rem;
  transition:all 150ms;
}
.role-btn svg{width:15px;height:15px;}
.role-btn:hover{background:var(--bg-muted);color:var(--text-primary);border-color:var(--border-strong);}
.role-btn.active{
  background:var(--accent-subtle);
  border-color:var(--accent);
  color:var(--text-primary);
  box-shadow:0 0 12px var(--accent-glow);
}
.field{margin-bottom:1.15rem;}
label{display:block;font-size:.7rem;font-weight:600;color:var(--text-secondary);letter-spacing:.04em;text-transform:uppercase;margin-bottom:.45rem;}
.input-wrap{position:relative;}
input{
  width:100%;
  height:40px;
  background:var(--bg-muted);
  border:1px solid var(--border-strong);
  border-radius:8px;
  color:var(--text-primary);
  font-family:'Inter',sans-serif;
  font-size:.85rem;
  padding:0 .85rem;
  outline:none;
  transition:border-color 150ms,box-shadow 150ms;
}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);}
input::placeholder{color:var(--text-muted);}
.eye-btn{
  position:absolute;
  right:.6rem;
  top:50%;
  transform:translateY(-50%);
  background:none;
  border:none;
  color:var(--text-muted);
  cursor:pointer;
  padding:.3rem;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:5px;
  transition:color 150ms;
}
.eye-btn svg{width:16px;height:16px;}
.eye-btn:hover{color:var(--text-primary);}
.btn-primary{
  width:100%;
  height:42px;
  background:var(--accent);
  color:var(--accent-fg);
  font-family:'Inter',sans-serif;
  font-size:.85rem;
  font-weight:600;
  border:none;
  border-radius:8px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:.5rem;
  transition:all 150ms;
  margin-top:1.5rem;
  box-shadow:0 1px 2px rgba(0,0,0,0.2);
}
.btn-primary:hover{background:var(--accent-hover);box-shadow:0 0 24px var(--accent-glow);transform:translateY(-1px);}
.btn-primary:active{transform:translateY(0);}
.btn-primary:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.btn-primary svg{width:16px;height:16px;}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.25);border-top-color:#ffffff;border-radius:50%;animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.error-msg{
  display:none;
  font-size:.76rem;
  color:#f87171;
  background:rgba(239,68,68,0.1);
  border:1px solid rgba(239,68,68,0.25);
  padding:.55rem .75rem;
  border-radius:7px;
  margin-top:.85rem;
  align-items:center;
  gap:.5rem;
  animation:fadeIn 200ms;
}
.error-msg svg{width:14px;height:14px;flex-shrink:0;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}}
.role-hint{
  font-size:.68rem;
  color:var(--text-muted);
  text-align:center;
  margin-top:1rem;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:.35rem;
}
.role-hint svg{width:12px;height:12px;}
.theme-bar{display:flex;align-items:center;gap:.6rem;justify-content:center;margin-top:1.75rem;}
.theme-bar span{font-size:.7rem;color:var(--text-muted);font-weight:500;}
.swatch{width:15px;height:15px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all 150ms;}
.swatch.active{border-color:rgba(255,255,255,.5);transform:scale(1.15);}
.sw-orange{background:#ff5722;}.sw-blue{background:#0ea5e9;}.sw-green{background:#22c55e;}.sw-purple{background:#8b5cf6;}
</style>
</head>
<body>
<div class="glow-bg"></div>
<a href="index.html" class="back">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
  All Demos
</a>

<div class="container">
  <div class="logo-area">
    <div class="logo-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v16M18 4v16M3 8h4M17 8h4M3 16h4M17 16h4M7 12h10"/></svg>
    </div>
    <div class="logo-name">GymERP</div>
    <div class="logo-tagline">Enterprise Gym Operations Platform</div>
  </div>

  <div class="card">
    <div class="role-bar-label">Interactive Prototype Role</div>
    <div class="role-select">
      <button type="button" class="role-btn active" onclick="setRole('platform',this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Platform
      </button>
      <button type="button" class="role-btn" onclick="setRole('admin',this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/></svg>
        Admin
      </button>
      <button type="button" class="role-btn" onclick="setRole('staff',this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Staff
      </button>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="name@example.com" value="rev@gymerp.io" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="••••••••" value="demo1234" required>
          <button type="button" class="eye-btn" onclick="togglePwd()" aria-label="Toggle password visibility" id="eyeBtn">
            <svg id="eyeSvg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn-primary" id="signInBtn">
        <span id="btnText" style="display:inline-flex;align-items:center;gap:.45rem;">
          Sign In
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </span>
      </button>
    </form>
    <div id="errorMsg" class="error-msg" role="alert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="errorText">Invalid credentials. Please try again.</span>
    </div>

    <div class="role-hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Role is verified cryptographically via JWT claims
    </div>
  </div>

  <div class="theme-bar">
    <span>Accent theme:</span>
    <div class="swatch sw-orange active" onclick="setTheme('orange',this)" title="Orange"></div>
    <div class="swatch sw-blue" onclick="setTheme('blue',this)" title="Electric Blue"></div>
    <div class="swatch sw-green" onclick="setTheme('green',this)" title="Neon Green"></div>
    <div class="swatch sw-purple" onclick="setTheme('purple',this)" title="Vivid Purple"></div>
  </div>
</div>

<script>
let currentRole='platform';
function setRole(r,el){
  currentRole=r;
  document.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  const emails={'platform':'rev@gymerp.io','admin':'owner@fitzone.com','staff':'desk@fitzone.com'};
  if(emails[r]) document.getElementById('email').value=emails[r];
}
function togglePwd(){
  const p=document.getElementById('password');
  const eyeSvg=document.getElementById('eyeSvg');
  if(p.type==='password'){
    p.type='text';
    eyeSvg.innerHTML='<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/>';
  }else{
    p.type='password';
    eyeSvg.innerHTML='<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
  }
}
function showError(msg){
  const el=document.getElementById('errorMsg');
  const txt=document.getElementById('errorText');
  txt.textContent=msg;
  el.style.display='flex';
}
function handleLogin(e){
  e.preventDefault();
  const btn=document.getElementById('signInBtn');
  const btnText=document.getElementById('btnText');
  const errorMsg=document.getElementById('errorMsg');
  errorMsg.style.display='none';
  const pass=document.getElementById('password').value;
  btn.disabled=true;
  btnText.innerHTML='<div class="spinner"></div>';
  setTimeout(()=>{
    if(pass.length<4){
      btn.disabled=false;
      btnText.innerHTML='Sign In <svg style="width:16px;height:16px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';
      showError('Invalid credentials. Please try again.');
      return;
    }
    const routes={'platform':'02-platform.html','admin':'03-admin.html','staff':'04-staff.html'};
    window.location.href=routes[currentRole];
  },1200);
}
function setTheme(t,el){
  document.documentElement.setAttribute('data-theme',t);
  document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
  localStorage.setItem('gymerp-theme',t);
}
const s=localStorage.getItem('gymerp-theme');
if(s){
  const el=document.querySelector('.sw-'+s);
  if(el)setTheme(s,el);
}
</script>
</body>
</html>
