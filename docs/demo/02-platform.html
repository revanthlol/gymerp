<!DOCTYPE html>
<html lang="en" data-theme="orange">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GymERP — Platform Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg-base:#0A0A0A;--bg-surface:#111113;--bg-elevated:#1A1A1F;--bg-muted:#222228;--border:rgba(255,255,255,0.08);--border-strong:rgba(255,255,255,0.15);--text-primary:#F4F4F5;--text-secondary:#A1A1AA;--text-muted:#52525B;--accent:#FF5722;--accent-hover:#FF6D3A;--accent-glow:rgba(255,87,34,0.18);--accent-subtle:rgba(255,87,34,0.1);--accent-fg:#fff;}
[data-theme=blue]{--accent:#00B4FF;--accent-glow:rgba(0,180,255,0.18);--accent-subtle:rgba(0,180,255,0.1);}
[data-theme=green]{--accent:#39FF14;--accent-glow:rgba(57,255,20,0.15);--accent-subtle:rgba(57,255,20,0.08);--accent-fg:#0a0a0a;}
[data-theme=purple]{--accent:#8B5CF6;--accent-glow:rgba(139,92,246,0.18);--accent-subtle:rgba(139,92,246,0.1);}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:var(--bg-base);color:var(--text-primary);height:100vh;display:flex;overflow:hidden;}
/* SIDEBAR */
.sidebar{width:240px;flex-shrink:0;background:var(--bg-surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:0;}
.sb-logo{display:flex;align-items:center;gap:.6rem;padding:1.25rem 1rem;border-bottom:1px solid var(--border);}
.sb-logo-icon{width:30px;height:30px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;box-shadow:0 0 12px var(--accent-glow);}
.sb-logo-text{font-size:.9rem;font-weight:700;}
.sb-logo-badge{font-size:.6rem;color:var(--accent);font-weight:600;background:var(--accent-subtle);padding:.15rem .4rem;border-radius:4px;letter-spacing:.04em;}
.sb-nav{flex:1;padding:.75rem .5rem;display:flex;flex-direction:column;gap:.15rem;}
.nav-item{display:flex;align-items:center;gap:.6rem;padding:.45rem .6rem;border-radius:7px;font-size:.85rem;font-weight:500;color:var(--text-secondary);cursor:pointer;transition:all 120ms;text-decoration:none;}
.nav-item:hover{background:var(--bg-muted);color:var(--text-primary);}
.nav-item.active{background:var(--accent-subtle);color:var(--accent);}
.nav-icon{width:18px;text-align:center;font-size:.95rem;}
.sb-bottom{padding:.75rem .75rem 1rem;border-top:1px solid var(--border);}
.sb-user{display:flex;align-items:center;gap:.6rem;margin-bottom:.75rem;}
.sb-avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-subtle);border:1.5px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700;color:var(--accent);}
.sb-user-name{font-size:.8rem;font-weight:600;}
.sb-user-role{font-size:.68rem;color:var(--text-muted);}
.theme-dots{display:flex;align-items:center;gap:.4rem;}
.theme-dots span{font-size:.68rem;color:var(--text-muted);}
.dot{width:12px;height:12px;border-radius:50%;cursor:pointer;border:1.5px solid transparent;transition:box-shadow 100ms;}
.dot.active{border-color:rgba(255,255,255,.4);}
.dot-orange{background:#FF5722;}.dot-blue{background:#00B4FF;}.dot-green{background:#39FF14;}.dot-purple{background:#8B5CF6;}
/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.page-header{display:flex;align-items:center;justify-content:space-between;padding:.9rem 1.5rem;border-bottom:1px solid var(--border);flex-shrink:0;}
.page-title{font-size:1.1rem;font-weight:700;}
.btn-primary{height:34px;padding:0 1rem;background:var(--accent);color:var(--accent-fg);font-family:'Inter',sans-serif;font-size:.8rem;font-weight:600;border:none;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:.35rem;transition:background 150ms,box-shadow 150ms;}
.btn-primary:hover{box-shadow:0 0 16px var(--accent-glow);}
.content{flex:1;overflow-y:auto;padding:1.25rem 1.5rem;}
.toolbar{display:flex;align-items:center;gap:.75rem;margin-bottom:1rem;}
.search-box{position:relative;flex:1;max-width:320px;}
.search-box input{width:100%;height:34px;background:var(--bg-muted);border:1px solid var(--border-strong);border-radius:7px;color:var(--text-primary);font-family:'Inter',sans-serif;font-size:.82rem;padding:0 .75rem 0 2rem;outline:none;transition:border-color 150ms,box-shadow 150ms;}
.search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow);}
.search-box input::placeholder{color:var(--text-muted);}
.search-icon{position:absolute;left:.6rem;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:.85rem;}
.select-filter{height:34px;background:var(--bg-muted);border:1px solid var(--border-strong);border-radius:7px;color:var(--text-secondary);font-family:'Inter',sans-serif;font-size:.82rem;padding:0 .75rem;outline:none;cursor:pointer;}
/* TABLE */
.table-wrap{background:var(--bg-surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;}
table{width:100%;border-collapse:collapse;}
thead th{padding:.6rem 1rem;text-align:left;font-size:.68rem;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);border-bottom:1px solid var(--border);}
thead th.sortable{cursor:pointer;user-select:none;}
thead th.sortable:hover{color:var(--text-secondary);}
tbody tr{border-bottom:1px solid var(--border);cursor:pointer;transition:background 100ms;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:rgba(255,255,255,0.03);}
tbody td{padding:.65rem 1rem;font-size:.85rem;}
.badge{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;font-weight:600;padding:.2rem .55rem;border-radius:5px;}
.badge-active{background:var(--accent-subtle);color:var(--accent);}
.badge-trial{background:rgba(234,179,8,.1);color:#eab308;}
.badge-suspended{background:rgba(239,68,68,.1);color:#f87171;}
.badge-plan{background:var(--bg-muted);color:var(--text-secondary);}
.dot-status{width:7px;height:7px;border-radius:50%;display:inline-block;}
.dot-a{background:var(--accent);}.dot-t{background:#eab308;}.dot-s{background:#f87171;}
.pagination{display:flex;align-items:center;justify-content:space-between;padding:.65rem 1rem;border-top:1px solid var(--border);}
.pag-info{font-size:.78rem;color:var(--text-muted);}
.pag-btns{display:flex;gap:.35rem;}
.pag-btn{width:28px;height:28px;border-radius:5px;background:var(--bg-muted);border:1px solid var(--border);color:var(--text-secondary);font-size:.78rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 100ms;}
.pag-btn:hover,.pag-btn.active{background:var(--accent-subtle);color:var(--accent);border-color:var(--accent);}
/* DRAWER */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;animation:fadeIn 200ms;}
.drawer{position:fixed;right:0;top:0;bottom:0;width:380px;background:var(--bg-elevated);border-left:1px solid var(--border-strong);z-index:101;display:none;flex-direction:column;transform:translateX(100%);transition:transform 250ms cubic-bezier(0.32,0.72,0,1);}
.drawer.open{transform:translateX(0);}
@keyframes fadeIn{from{opacity:0}}
.drawer-header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid var(--border);}
.drawer-title{font-size:.95rem;font-weight:700;}
.close-btn{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1.1rem;padding:.25rem;line-height:1;border-radius:4px;transition:color 150ms;}
.close-btn:hover{color:var(--text-primary);}
.drawer-body{flex:1;overflow-y:auto;padding:1.25rem;}
.detail-name{font-size:1.2rem;font-weight:700;margin-bottom:.25rem;}
.detail-id{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--text-muted);margin-bottom:1rem;}
.detail-row{display:flex;justify-content:space-between;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--border);}
.detail-row:last-of-type{border-bottom:none;}
.detail-label{font-size:.78rem;color:var(--text-secondary);}
.detail-val{font-size:.85rem;font-weight:500;}
.drawer-actions{display:flex;flex-direction:column;gap:.6rem;padding:1rem 1.25rem;border-top:1px solid var(--border);}
.btn-danger{height:36px;padding:0 1rem;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:#f87171;font-family:'Inter',sans-serif;font-size:.82rem;font-weight:600;border-radius:7px;cursor:pointer;transition:all 150ms;}
.btn-danger:hover{background:rgba(239,68,68,.25);}
.btn-accent{height:36px;padding:0 1rem;background:var(--accent);color:var(--accent-fg);font-family:'Inter',sans-serif;font-size:.82rem;font-weight:600;border:none;border-radius:7px;cursor:pointer;transition:all 150ms;}
.btn-accent:hover{box-shadow:0 0 14px var(--accent-glow);}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:center;justify-content:center;animation:fadeIn 150ms;}
.modal{background:var(--bg-elevated);border:1px solid var(--border-strong);border-radius:12px;padding:1.5rem;width:100%;max-width:420px;box-shadow:inset 0 0 0 1px var(--accent-glow),0 8px 40px rgba(0,0,0,.5);}
.modal-title{font-size:1rem;font-weight:700;margin-bottom:.25rem;}
.modal-divider{height:1px;background:var(--border);margin:.75rem 0 1.25rem;}
.field{margin-bottom:1rem;}
.field label{display:block;font-size:.7rem;font-weight:600;color:var(--text-secondary);letter-spacing:.04em;text-transform:uppercase;margin-bottom:.35rem;}
.field input,.field select{width:100%;height:36px;background:var(--bg-muted);border:1px solid var(--border-strong);border-radius:7px;color:var(--text-primary);font-family:'Inter',sans-serif;font-size:.83rem;padding:0 .75rem;outline:none;transition:border-color 150ms;}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-glow);}
.modal-btns{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1.25rem;}
.btn-ghost{height:34px;padding:0 .9rem;background:transparent;border:1px solid var(--border-strong);color:var(--text-secondary);font-family:'Inter',sans-serif;font-size:.8rem;border-radius:7px;cursor:pointer;transition:all 150ms;}
.btn-ghost:hover{color:var(--text-primary);border-color:var(--border-strong);}
</style>
</head>
<body>

<div class="sidebar">
  <div class="sb-logo">
    <div class="sb-logo-icon">🏋️</div>
    <div>
      <div class="sb-logo-text">GymERP</div>
      <div class="sb-logo-badge">PLATFORM</div>
    </div>
  </div>
  <div class="sb-nav">
    <div class="nav-item active"><span class="nav-icon">🏢</span> Tenants</div>
    <div class="nav-item"><span class="nav-icon">⚙️</span> Settings</div>
    <div class="nav-item"><span class="nav-icon">👤</span> Account</div>
  </div>
  <div class="sb-bottom">
    <div class="sb-user">
      <div class="sb-avatar">R</div>
      <div><div class="sb-user-name">Rev</div><div class="sb-user-role">Platform Admin</div></div>
    </div>
    <div class="theme-dots">
      <span>Theme:</span>
      <div class="dot dot-orange active" onclick="setTheme('orange',this)"></div>
      <div class="dot dot-blue" onclick="setTheme('blue',this)"></div>
      <div class="dot dot-green" onclick="setTheme('green',this)"></div>
      <div class="dot dot-purple" onclick="setTheme('purple',this)"></div>
    </div>
    <div style="margin-top:.75rem;"><a href="index.html" style="font-size:.72rem;color:var(--text-muted);text-decoration:none;">← All Demos</a></div>
  </div>
</div>

<div class="main">
  <div class="page-header">
    <div class="page-title">Tenants</div>
    <button class="btn-primary" onclick="openModal()">+ New Tenant</button>
  </div>
  <div class="content">
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search tenants..." oninput="filterTable()">
      </div>
      <select class="select-filter" id="statusFilter" onchange="filterTable()">
        <option value="">Status: All</option>
        <option value="active">Active</option>
        <option value="trial">Trial</option>
        <option value="suspended">Suspended</option>
      </select>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="sortable">Gym Name ↕</th>
            <th>Status</th>
            <th class="sortable">Members ↕</th>
            <th>Plan</th>
            <th class="sortable">Since ↕</th>
          </tr>
        </thead>
        <tbody id="tenantTable">
        </tbody>
      </table>
      <div class="pagination">
        <div class="pag-info" id="pagInfo"></div>
        <div class="pag-btns">
          <div class="pag-btn">‹</div>
          <div class="pag-btn active">1</div>
          <div class="pag-btn">2</div>
          <div class="pag-btn">3</div>
          <div class="pag-btn">›</div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Drawer Overlay -->
<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div class="drawer-title">Tenant Detail</div>
    <button class="close-btn" onclick="closeDrawer()">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-actions">
    <button class="btn-danger" id="drawerDangerBtn" onclick="toggleTenantStatus()"></button>
    <button class="btn-accent" id="drawerAccentBtn" onclick="toggleTenantStatus()"></button>
  </div>
</div>

<!-- New Tenant Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-title">Create New Tenant</div>
    <div class="modal-divider"></div>
    <div class="field"><label>Gym Name</label><input type="text" id="newGymName" placeholder="e.g. FitZone Gym"></div>
    <div class="field"><label>Owner Email</label><input type="email" id="newOwnerEmail" placeholder="owner@theirgym.com"></div>
    <div class="field"><label>Plan</label>
      <select id="newPlan"><option>Trial</option><option>Basic</option><option>Pro</option></select>
    </div>
    <div class="modal-btns">
      <button class="btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="createTenant()">Create Tenant →</button>
    </div>
  </div>
</div>

<script>
const tenants=[
  {id:'tenant_abc123',name:'FitZone Gym',owner:'owner@fitzzone.com',status:'active',members:142,plan:'Pro',since:'Jan 2025',lastLogin:'2h ago'},
  {id:'tenant_def456',name:'PowerHouse Pro',owner:'owner@powerhouse.com',status:'trial',members:0,plan:'Trial',since:'Aug 2026',lastLogin:'1d ago'},
  {id:'tenant_ghi789',name:'Iron Will Club',owner:'owner@ironwill.com',status:'suspended',members:89,plan:'Basic',since:'Mar 2024',lastLogin:'30d ago'},
  {id:'tenant_jkl012',name:'Peak Performance',owner:'owner@peakperf.com',status:'active',members:231,plan:'Pro',since:'Jun 2024',lastLogin:'4h ago'},
  {id:'tenant_mno345',name:'Body Works',owner:'owner@bodyworks.com',status:'active',members:57,plan:'Basic',since:'Nov 2024',lastLogin:'1h ago'},
  {id:'tenant_pqr678',name:'Apex Fitness',owner:'owner@apex.com',status:'active',members:198,plan:'Pro',since:'Feb 2025',lastLogin:'3h ago'},
  {id:'tenant_stu901',name:'Flex Arena',owner:'owner@flexarena.com',status:'trial',members:0,plan:'Trial',since:'Sep 2026',lastLogin:'6h ago'},
];
let filtered=[...tenants];
let selectedTenant=null;

function badgeHtml(status){
  if(status==='active') return `<span class="badge badge-active"><span class="dot-status dot-a"></span>Active</span>`;
  if(status==='trial') return `<span class="badge badge-trial"><span class="dot-status dot-t"></span>Trial</span>`;
  return `<span class="badge badge-suspended"><span class="dot-status dot-s"></span>Suspended</span>`;
}
function renderTable(){
  const tb=document.getElementById('tenantTable');
  tb.innerHTML=filtered.map(t=>`
    <tr onclick="openDrawer('${t.id}')">
      <td style="font-weight:500">${t.name}</td>
      <td>${badgeHtml(t.status)}</td>
      <td>${t.members}</td>
      <td><span class="badge badge-plan">${t.plan}</span></td>
      <td style="color:var(--text-secondary)">${t.since}</td>
    </tr>
  `).join('');
  document.getElementById('pagInfo').textContent=`Showing 1–${filtered.length} of ${filtered.length} tenants`;
}
function filterTable(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  const st=document.getElementById('statusFilter').value;
  filtered=tenants.filter(t=>{
    const matchQ=!q||t.name.toLowerCase().includes(q)||t.owner.toLowerCase().includes(q);
    const matchS=!st||t.status===st;
    return matchQ&&matchS;
  });
  renderTable();
}
function openDrawer(id){
  selectedTenant=tenants.find(t=>t.id===id);
  if(!selectedTenant) return;
  const t=selectedTenant;
  document.getElementById('drawerBody').innerHTML=`
    <div class="detail-name">${t.name}</div>
    <div class="detail-id">ID: ${t.id}</div>
    <div class="detail-row"><span class="detail-label">Status</span>${badgeHtml(t.status)}</div>
    <div class="detail-row"><span class="detail-label">Owner</span><span class="detail-val" style="font-size:.78rem">${t.owner}</span></div>
    <div class="detail-row"><span class="detail-label">Members</span><span class="detail-val">${t.members}</span></div>
    <div class="detail-row"><span class="detail-label">Plan</span><span class="detail-val">${t.plan}</span></div>
    <div class="detail-row"><span class="detail-label">Since</span><span class="detail-val">${t.since}</span></div>
    <div class="detail-row"><span class="detail-label">Last Login</span><span class="detail-val" style="color:var(--text-secondary)">${t.lastLogin}</span></div>
  `;
  updateDrawerBtns();
  document.getElementById('overlay').style.display='block';
  const dr=document.getElementById('drawer');
  dr.style.display='flex';
  requestAnimationFrame(()=>dr.classList.add('open'));
}
function updateDrawerBtns(){
  const t=selectedTenant;
  const db=document.getElementById('drawerDangerBtn');
  const ab=document.getElementById('drawerAccentBtn');
  if(t.status==='suspended'){db.style.display='none';ab.textContent='Activate Tenant';}
  else{db.style.display='block';db.textContent='Suspend Tenant';ab.textContent='View Details →';}
}
function toggleTenantStatus(){
  if(!selectedTenant) return;
  if(selectedTenant.status!=='suspended'){
    if(confirm('Suspend '+selectedTenant.name+'? They will lose access.')){
      selectedTenant.status='suspended';
      renderTable();
      openDrawer(selectedTenant.id);
    }
  }
}
function closeDrawer(){
  const dr=document.getElementById('drawer');
  dr.classList.remove('open');
  setTimeout(()=>{dr.style.display='none';document.getElementById('overlay').style.display='none';},260);
}
function openModal(){document.getElementById('modalOverlay').style.display='flex';}
function closeModal(e){if(!e||e.target===document.getElementById('modalOverlay'))document.getElementById('modalOverlay').style.display='none';}
function createTenant(){
  const name=document.getElementById('newGymName').value.trim();
  const email=document.getElementById('newOwnerEmail').value.trim();
  const plan=document.getElementById('newPlan').value;
  if(!name||!email){alert('Please fill in all fields.');return;}
  tenants.unshift({id:'tenant_new'+Date.now(),name,owner:email,status:'trial',members:0,plan,since:'Sep 2026',lastLogin:'just now'});
  filterTable();
  closeModal();
  document.getElementById('newGymName').value='';
  document.getElementById('newOwnerEmail').value='';
}
function setTheme(t,el){document.documentElement.setAttribute('data-theme',t);document.querySelectorAll('.dot').forEach(d=>d.classList.remove('active'));el.classList.add('active');localStorage.setItem('gymerp-theme',t);}
const s=localStorage.getItem('gymerp-theme');if(s){const el=document.querySelector('.dot-'+s);if(el)setTheme(s,el);}
renderTable();
</script>
</body>
</html>
